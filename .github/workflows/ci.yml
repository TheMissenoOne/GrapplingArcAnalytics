name: Analytics CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # The video extra (manimgl/moviepy/playwright) assumes system toolchains the
      # runner lacks (Pango headers, g++/OpenGL) -- its own pyproject comment says the
      # base env must not need them. Building it here killed every CI run at sync
      # since 2026-08-20, masking real mypy debt behind a build failure.
      - run: uv sync --all-extras --no-extra video
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - name: alembic single head
        run: |
          heads=$(uv run alembic heads | grep -c '(head)')
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly 1 alembic head, found $heads:"
            uv run alembic heads
            exit 1
          fi
      - name: import smoke
        run: >-
          uv run python -c
          "import export, analysis, db, admin, schemas"

  migrations-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grapplingarc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra postgres
      # The revisions target Supabase and reference objects the platform
      # provisions rather than creating: the anon/authenticated/service_role
      # roles, auth.uid()/auth.users, and the extensions schema. Without this a
      # vanilla pgvector image dies at revision 0003 on a missing role.
      #
      # Applied via psycopg (already an installed dependency, see the `postgres`
      # extra above) rather than shelling out to `psql` — the runner image
      # having a Postgres client at all is an assumption not worth making.
      - name: Scaffold the Supabase-provided objects
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grapplingarc_ci
        run: >-
          uv run python -c
          "import os, psycopg;
          conn = psycopg.connect(os.environ['DATABASE_URL'], autocommit=True);
          conn.cursor().execute(open('ci/supabase_scaffold.sql').read())"
      - name: alembic upgrade head (empty DB)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grapplingarc_ci
        run: uv run alembic upgrade head
      # The pytest suite runs on SQLite and cannot execute a policy, a view or a
      # plpgsql function. The invariant that a user's own label never reaches the
      # world-readable technique library lives entirely in those, so it is checked
      # here, where a real Postgres with the whole chain applied already exists.
      - name: No private graph label can reach the public library
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grapplingarc_ci
        run: uv run python ci/verify_private_graph_nodes.py
      # A trigger and a cascade, neither of which SQLite can execute. This is what the schema
      # does on its own — the part that has to stay true when someone deletes a user from the
      # dashboard rather than through the Edge Function.
      - name: Deleting an identity leaves nothing owner-scoped behind
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grapplingarc_ci
        run: uv run python ci/verify_owner_deletion.py
      # RLS is not one layer of several — Supabase grants every new table to anon and
      # authenticated by default, so the policies are the only thing between one athlete's
      # training data and another's. Two users and an anonymous caller, evaluated for real.
      - name: Two users cannot see each other under RLS
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grapplingarc_ci
        run: uv run python ci/verify_rls_isolation.py

  edge-functions:
    # The Edge Functions are Deno, not Python, so nothing in the job above sees them. The
    # account-deletion tests encode an ordering (files, then graph, then identity) whose whole
    # point is that a partial deletion is never reported as success.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: deno check supabase/functions/delete-account/index.ts
      # No permission flags: these are pure-logic tests and must stay that way. A test that
      # needs the network is testing the network.
      - name: deno test
        run: deno test supabase/functions/
