[project]
name = "grappling-arc-analytics"
version = "0.1.0"
description = "Analytics module for GrapplingArc — data pipelines, ELO calibration, CV investigation, and pro benchmarking"
authors = [
    { name = "GrapplingArc", email = "dev@grapplingarc.app" },
]
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Core data
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "networkx>=3.3",
    # Kaggle integration
    "kagglehub[pandas-datasets]>=1.0",
    # Web scraping (BJJ Heroes)
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "nest-asyncio>=1.6",
    # YouTube fight-transcript harvesting (harvest/)
    "youtube-transcript-api>=0.6,<1",
    "feedparser>=6.0",
    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    # Stats — imported directly (network_metrics._beta_ci, metric_evaluation correlations).
    # Was only ever present transitively via scikit-learn; declare it so it cannot vanish.
    "scipy>=1.14",
    # Viz
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Notebooks
    "jupyter>=1.0",
    # CV (pose → position)
    "opencv-python>=4.10",
    "pillow>=10.4",
    # Utils
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sentence-transformers>=5.6.0",
    "pgvector>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.11",
]
cv = [
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.2",
    "onnxruntime>=1.18",
    # The Roboflow backend (cv/roboflow_classifier.py) calls the hosted serverless
    # HTTP API via `requests` (a core dep) — no extra install needed. A self-hosted
    # `inference` server is optional (point RoboflowClassifier.api_url at it).
]
realtime = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.11",
]
# Local admin dashboard (admin/) — single light extra so the whole thing starts with one
# `uv run --extra web python -m admin`. Postgres here because the dashboard reads the prod DB
# via DATABASE_URL; django-free. Never hosted — binds 127.0.0.1 only by default.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
]
viz = [
    "plotly>=5.24",
    "ipywidgets>=8.1",
]
postgres = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.urls]
Repository = "https://github.com/vetor/GrapplingArcAnalytics"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks", "transcripts"]  # exploratory notebooks + raw match dumps/transcripts

# ponytail: `ruff format --check .` is NOT gated in CI (2026-07-27) — 205 of 283 files would be
# reformatted today. Running it now would collide with every worktree/PR in flight. Debt: run
# `uv run ruff format .` in its own follow-up PR (no logic changes, one big diff, land when the
# in-flight worktrees have merged), then add `uv run ruff format --check .` to ci.yml.

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# ponytail: measured 2026-07-27 — `scripts/` (one-off dump/import/verify scripts) carries 49
# pre-existing findings (37 E501, 5 E402, 3 F841, 2 N806, 1 E722, 1 E741) that are debt, not new
# breakage. Ignored HERE (not globally, not `# noqa`) so `ruff check .` gates the rest of the repo
# clean. Upgrade path: pick these off script-by-script, then drop this block once `scripts/` is
# clean under `ruff check .` unscoped.
[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E501", "E402", "F841", "N806", "E722", "E741"]
# ponytail: rls_auto_enable()'s plpgsql body is adopted byte-for-byte from
# pg_get_functiondef (see the migration's docstring) — its raise-log format strings run
# past 100 cols in the source, and reformatting a security-relevant function body just to
# satisfy a linter is exactly how a byte-for-byte adoption stops being byte-for-byte.
"alembic/versions/0023_adopt_auth_setup.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
# ponytail: scripts/notebooks are not typed packages; decision_vision is explicitly a PoC and
# currently resolves as loose modules rather than `poc.decision_vision.*`, so module overrides do
# not reliably match it. Keep exploratory code out of the repo-wide strict gate until issue #4
# types/packages it deliberately; production analysis/realtime/db code remains strict-gated.
exclude = ["notebooks/", "scripts/", "poc/decision_vision/"]

# ponytail: measured 2026-07-27 (re-confirmed against this worktree, not copied blind) — with
# `scripts/` excluded above, `uv run mypy .` still finds 320 errors across 48 modules (31 tests/,
# 14 analysis/, 2 export/, 1 scripts/-imported-by-tests). Rather than `ignore_errors` globally
# (which would let new files ship unchecked), list the dirty modules explicitly so the ~138
# already-clean files stay gated and no new file can quietly join this list. Upgrade path: clean a
# module's mypy errors, then delete its line below — never add a new module here without a
# follow-up ticket to remove it.
[[tool.mypy.overrides]]
module = [
    "analysis.archetype",
    "analysis.athlete_elo",
    "analysis.athlete_systems",
    "analysis.defense_rate",
    "analysis.fighter_similarity",
    "analysis.gnn_predictor",
    "analysis.graph_comparison",
    "analysis.grappling_map",
    "analysis.match_deviance",
    "analysis.metric_evaluation",
    "analysis.ocean",
    "analysis.ufc_elo_engine",
    "analysis.user_insights",
    "analysis.user_profile",
    "export.grapplemap_icons_export",
    "export.site_data",
    "scripts.dump_import",
    "tests.test_admin",
    "tests.test_apply_video_fixes",
    "tests.test_archetype",
    "tests.test_athlete_elo",
    "tests.test_athlete_graph",
    "tests.test_benchmark",
    "tests.test_db",
    "tests.test_decision_space",
    "tests.test_deviance",
    "tests.test_discipline",
    "tests.test_dump_winner_inference",
    "tests.test_elo_convergence",
    "tests.test_embeddings",
    "tests.test_grapplemap",
    "tests.test_inference",
    "tests.test_match_breakdown",
    "tests.test_merge_attempt_nodes",
    "tests.test_merge_technique_dups",
    "tests.test_name_sanitize",
    "tests.test_ocean",
    "tests.test_ontology",
    "tests.test_path_to_victory",
    "tests.test_priors",
    "tests.test_pro_analytics_models",
    "tests.test_publish_pro_analytics",
    "tests.test_realtime_app",
    "tests.test_roboflow_classifier",
    "tests.test_server",
    "tests.test_vector_store",
    "tests.test_video_index",
    "tests.test_vocab_map",
]
ignore_errors = true

# ponytail: measured 2026-08-18 after the repo-wide CI gate was enabled. These non-PoC modules were
# added after the July baseline and expose strict-mypy debt once Ruff stops failing first. Keep the
# debt explicit rather than disabling strict mode or ignoring the whole repo. Issue #4 tracks
# typing each module for real and removing it from this temporary list.
#
# 2026-08-19: EVERY non-test module retired, in two passes. The first took
# analysis.discipline, analysis.rating_v2.persist, analysis.rating_v2.replay,
# analysis.scouting_rulesets, cv.pose_estimate, scripts.compare_athlete_system_detectors,
# scripts.group_admin and scripts.measure_community_stability_under_weight. The second took the
# four that carried real errors — admin.study, analysis.category_constellations,
# analysis.scouting_report, analysis.transitions.build_graph — with annotations and narrowing,
# no relaxation and no new ignore. Two of those were genuine defects wearing a type error: one
# name bound to two different shapes inside one function, twice.
#
# The four remaining `scripts.*` entries below are REDUNDANT and kept only until someone decides
# about them: `scripts/` is already in `[tool.mypy] exclude` (see above), so these lines do
# nothing today. Whether `scripts/` should leave that exclude list is its own decision — the
# module count there is real work, and mixing it into this list is what made "eight remaining"
# read as twice the debt it was.
#
# Everything else below is test modules. Issue #4 is closed for production code.
[[tool.mypy.overrides]]
module = [
    "scripts.apply_decision_results",
    "scripts.measure_confidence_weighting",
    "scripts.scouting_division_report",
    "scripts.scouting_matches_csv",
    "tests.poc.test_decision_vision_dashboard",
    "tests.poc.test_decision_vision_live_state",
    "tests.poc.test_decision_vision_progress",
    "tests.poc.test_decision_vision_role_tracking",
    "tests.poc.test_decision_vision_vicos_state",
    "tests.poc.test_decision_vision_visual_labels",
    "tests.poc.test_external_dataset_registry",
    "tests.test_apply_decision_results",
    "tests.test_apply_events",
    "tests.test_backfill_taxonomy_id",
    "tests.test_category_profile",
    "tests.test_compare_athlete_system_detectors",
    "tests.test_decision_criteria",
    "tests.test_decision_flow",
    "tests.test_dossier_decision_flow",
    "tests.test_exchange_cycles",
    "tests.test_flowchart_compiler",
    "tests.test_group_admin",
    "tests.test_opponent_conditions",
    "tests.test_private_data_boundary",
    "tests.test_pro_analytics",
    "tests.test_pro_analytics_systemd",
    "tests.test_rating_v2",
    "tests.test_report_charts",
    "tests.test_scouting_division_report",
    "tests.test_scouting_report",
    "tests.test_site_branding",
    "tests.test_site_confidence_gate",
    "tests.test_study_knowledge",
    "tests.test_study",
    "tests.test_study_reports",
    "tests.test_taxonomy_map",
    "tests.test_taxonomy",
    "tests.test_transitions",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
